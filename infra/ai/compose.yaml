name: bilimhub-ai-lab
services:
  ollama:
    # Official registry digest checked 2026-11-04; update deliberately after validation.
    image: ollama/ollama@sha256:ebaef4f4c5d93660e1f25f8ad085a112f51ccfb0e8458073e71793959dba91c9
    ports:
      - "127.0.0.1:11434:11434"
    environment:
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_CONTEXT_LENGTH: "2048"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    volumes:
      - models:/root/.ollama
    mem_limit: 4g
    cpus: 4
    restart: unless-stopped
volumes:
  models:
